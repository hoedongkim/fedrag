name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest + Postgres)
    runs-on: ubuntu-latest
    # Throwaway Postgres for the db-marked tests; they drop and recreate schema fedrag.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fedrag
          POSTGRES_PASSWORD: fedrag
          POSTGRES_DB: fedrag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fedrag -d fedrag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fedrag:fedrag@127.0.0.1:5432/fedrag_test
      # Tests never download models or call OpenAI (fakes stand in; "live" tests are skipped unless
      # RUN_LIVE_TESTS=1). Offline mode makes an accidental Hugging Face download fail loudly.
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt

      # The reranker's torch from the CPU wheel index first, so pip never pulls the CUDA build and
      # its multi-GB nvidia-* wheels; the constrained install then keeps it (torch==2.14.1 matches
      # 2.14.1+cpu). Keep this version equal to torch in backend/constraints.txt.
      - name: Install CPU-only torch
        run: pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install backend
        run: pip install -e "backend[dev]" -c backend/constraints.txt

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .

      - name: Tests
        working-directory: backend
        run: pytest -m "not db"

      - name: Postgres tests
        working-directory: backend
        run: pytest -m db

  frontend:
    name: Frontend (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  contract:
    name: API contract (generated files up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The reranker's torch from the CPU wheel index first, so pip never pulls the CUDA build and
      # its multi-GB nvidia-* wheels; the constrained install then keeps it (torch==2.14.1 matches
      # 2.14.1+cpu). Keep this version equal to torch in backend/constraints.txt.
      - name: Install CPU-only torch
        run: pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install backend
        run: pip install -e backend -c backend/constraints.txt

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Regenerate openapi.json and schema.d.ts
        run: |
          python backend/scripts/export_openapi.py frontend/openapi.json
          npm --prefix frontend run gen:api

      - name: Fail if the generated files drifted
        run: |
          files="frontend/openapi.json frontend/src/lib/api/schema.d.ts"
          untracked="$(git ls-files --others --exclude-standard -- $files)"
          if ! git diff --exit-code -- $files || [ -n "$untracked" ]; then
            echo "::error::The API contract changed but the generated files were not updated. Run 'make gen-api' and commit the result."
            git status --short -- $files
            exit 1
          fi
