[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fedrag-backend"
version = "0.1.0"
description = "FastAPI backend for FedRAG, an LLM-powered analysis system for FOMC communications."
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Hoedong Kim" }]
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic-settings>=2.15.0",
    "httpx2>=2.13.1",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "psycopg[binary]>=3.3.6",
    "psycopg-pool>=3.3.3",
    "langchain-core>=1.6.10",
    "langchain-openai>=1.7.1",
    "langchain-chroma>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "chromadb>=1.5.9",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "openpyxl>=3.1.5",
    "scikit-learn>=1.9.1",
    "transformers>=5.19.0",
    "torch>=2.14.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
